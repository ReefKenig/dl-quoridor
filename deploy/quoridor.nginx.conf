# Nginx reverse proxy for Quoridor AI game server
# Install: sudo cp quoridor.nginx.conf /etc/nginx/conf.d/quoridor.conf && sudo systemctl restart nginx

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name quoridor.cs.colman.ac.il;
    return 301 https://$host$request_uri;
}

# HTTPS server — terminates SSL and proxies to gunicorn on port 8000
server {
    listen 443 ssl;
    server_name quoridor.cs.colman.ac.il;

    ssl_certificate /etc/ssl/cs/CSB.crt;
    ssl_certificate_key /etc/ssl/cs/myserver.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
