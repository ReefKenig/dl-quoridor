name: tests

# Every review on this repo so far has had to quote local test output, because
# `gh pr checks` reported "no checks reported" on every branch including dev.
on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements.txt is the single source of truth; hand-listing a subset
      # here means a bumped floor there leaves CI on the old version. torch comes
      # from the CPU wheel index first so the default index does not pull CUDA.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run the suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Caps torch intra-op threads: the runner has 2 cores and the tests
          # fan out worker processes, so per-process thread pools oversubscribe.
          OMP_NUM_THREADS: "1"
        run: pytest tests/ -q --durations=10
