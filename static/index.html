<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quoridor AI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="main-menu" class="container">
      <h1>Quoridor AI</h1>

      <div class="menu-options">
        <div>
          <label for="num-players">Number of Players</label>
          <select id="num-players">
            <option value="2">2 Players</option>
            <option value="4" selected>4 Players</option>
          </select>
        </div>

        <div>
          <label for="difficulty">Difficulty</label>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>

        <div>
          <label for="board-size">Board Size</label>
          <select id="board-size">
            <option value="5">5 × 5</option>
            <option value="9">9 × 9</option>
          </select>
        </div>
      </div>

      <button class="btn-primary" onclick="startGame()">Start Game</button>
    </div>

    <div id="game-screen" class="container hidden">
      <h2 id="game-status">Player 1's turn</h2>

      <div class="game-layout">
        <canvas id="game-board"></canvas>

        <div id="walls-panel" class="walls-panel"></div>
      </div>

      <div class="game-buttons">
        <button onclick="quitToMenu()">Quit</button>
        <button id="restart-btn" class="hidden" onclick="restartGame()">
          Play Again
        </button>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="js/constants.js"></script>
    <script src="index.js"></script>
    <script src="js/drawing.js"></script>
    <script src="js/input.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
