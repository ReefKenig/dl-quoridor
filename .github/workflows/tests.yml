name: tests

# Every review on this repo so far has had to quote local test output, because
# `gh pr checks` reported "no checks reported" on every branch including dev.
on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Everything the suite imports. gymnasium and stable_baselines3 are here
      # only for tests/test_sb3.py, which imports them unguarded — without them
      # that file errors at collection and reds the whole run. flask, pygame,
      # wandb and gunicorn are the server/UI stack and no test touches them.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy>=1.24.0" "matplotlib>=3.7.0" "psutil>=5.9.0" \
                      "pytest>=7.0.0" "gymnasium>=1.0.0" "stable-baselines3>=2.4.0"

      - name: Run the suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Self-play and eval spawn workers; the runner has 2 cores and the
          # tests that fan out read this rather than probing the host.
          OMP_NUM_THREADS: "1"
        run: pytest tests/ -q --durations=10
