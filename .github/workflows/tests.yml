name: tests

# Every review on this repo so far has had to quote local test output, because
# `gh pr checks` reported "no checks reported" on every branch including dev.
on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # torch first, from the CPU wheel index — requirements-test.txt omits it
      # so nothing re-resolves it against PyPI and drags in the CUDA build.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-test.txt

      - name: Run the suite
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Caps torch intra-op threads: the runner has 2 cores and the tests
          # fan out worker processes, so per-process thread pools oversubscribe.
          OMP_NUM_THREADS: "1"
        run: pytest tests/ -q --durations=10
